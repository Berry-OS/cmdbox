<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="288" viewBox="0 0 1080 288" role="img" aria-labelledby="title desc">
  <title id="title">cmdbox — One binary, many Linux commands</title>
  <desc id="desc">Dark terminal-style illustration with example cmdbox commands and a single static ELF build.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101A2B"/><stop offset="1" stop-color="#263A52"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#6EE7B7"/></linearGradient>
  </defs>
  <rect width="1080" height="288" rx="20" fill="url(#bg)"/>
  <circle cx="78" cy="56" r="75" fill="#62BBEB" opacity=".06"/>
  <circle cx="1014" cy="245" r="127" fill="#6EE7B7" opacity=".055"/>
  <rect x="42" y="44" width="512" height="200" rx="14" fill="#0B1220" stroke="#3F526B" stroke-width="2"/>
  <path d="M42 82H554" stroke="#3F526B" stroke-width="2"/>
  <circle cx="68" cy="64" r="6" fill="#F87171"/><circle cx="89" cy="64" r="6" fill="#FBBF24"/><circle cx="110" cy="64" r="6" fill="#6EE7B7"/>
  <text x="138" y="70" fill="#AFC1D6" font-size="16" font-family="DejaVu Sans, sans-serif">terminal</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="19">
    <text x="66" y="121" fill="#6EE7B7">$</text><text x="90" y="121" fill="#E5EDF6">cmdbox --list</text>
    <text x="66" y="162" fill="#6EE7B7">$</text><text x="90" y="162" fill="#E5EDF6">cmdbox ls -la</text>
    <text x="66" y="203" fill="#6EE7B7">$</text><text x="90" y="203" fill="#E5EDF6">cmdbox grep --color=auto</text>
  </g>
  <text x="606" y="103" fill="url(#accent)" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="51">cmdbox</text>
  <text x="606" y="144" fill="#F1F5F9" font-family="DejaVu Sans, sans-serif" font-weight="600" font-size="22">One binary. Many commands.</text>
  <text x="606" y="179" fill="#C3D0DE" font-family="DejaVu Sans, sans-serif" font-size="17">Zig · Linux · static musl ELF</text>
  <rect x="606" y="202" width="194" height="31" rx="15" fill="#203D4A" stroke="#3C9B96"/>
  <text x="703" y="223" text-anchor="middle" fill="#8BF1D2" font-family="DejaVu Sans, sans-serif" font-size="14">Compact &amp; testable</text>
</svg>
